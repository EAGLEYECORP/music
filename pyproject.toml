[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studiomix"
version = "0.2.0"
description = "Automatic vocal + instrumental mixing and streaming-ready mastering"
readme = "README.md"
requires-python = ">=3.10"
# Only pure-Python / Termux-packaged dependencies, so it installs on Android (Termux) too.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyloudnorm>=0.1.1",
]

[project.optional-dependencies]
fast = ["numba>=0.58"]          # JIT for the dynamics loops (desktop; not available on Termux)
formats = ["soundfile>=0.12"]   # decode flac/ogg/mp3 without ffmpeg
ai = ["onnxruntime>=1.16"]       # AI vocal separation / AI remix (computer; models download on first use)
dev = ["pytest>=7"]

[project.scripts]
studiomix = "studiomix.cli:main"

[tool.setuptools.packages.find]
include = ["studiomix*"]
