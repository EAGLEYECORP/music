[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studiomix"
version = "0.1.0"
description = "Automatic vocal + instrumental mixing and streaming-ready mastering"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
    "pyloudnorm>=0.1.1",
    "numba>=0.58",
    "pedalboard>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
studiomix = "studiomix.cli:main"

[tool.setuptools.packages.find]
include = ["studiomix*"]
